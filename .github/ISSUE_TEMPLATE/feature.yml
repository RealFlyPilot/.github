name: Feature
description: New functionality or a change to existing behavior
type: Feature
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should this do, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it's done?
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design / references
      description: Figma links, mockups, examples.
  - type: textarea
    id: notes
    attributes:
      label: Notes
