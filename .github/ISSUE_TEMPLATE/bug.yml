name: Bug
description: Something isn't working
type: Bug
body:
  - type: textarea
    id: what
    attributes:
      label: What's happening
      description: What's broken, and where (URL or page)?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      multiple: true
      options:
        - Local
        - Staging
        - Production
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device
      placeholder: Chrome on macOS, Safari on iPhone
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Drag files here.
